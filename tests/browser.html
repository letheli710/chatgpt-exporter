<!doctype html><html lang="zh"><meta charset="utf-8"><title>归档原型自动化验证（模拟截图源）</title>
<style>body{margin:0;font:16px/1.6 system-ui;background:#eef3f4;color:#132c31}header{height:64px;padding:12px 28px;background:#163d43;color:white}#scroll{height:calc(100vh - 64px);overflow:auto}article{margin:28px auto;width:600px;background:white;padding:24px;border-radius:12px}.card{border:2px solid #198d86;border-radius:12px;padding:18px;margin:16px 0}input{padding:8px}section.band{height:260px;padding:24px;background:#d9ede7;border-bottom:2px solid white}h2{margin:0 0 12px}.disclaimer{font-size:12px}</style>
<header>浏览器布局验证 · 模拟 Chrome 截图源 <span class="disclaimer">用于验证滚动、裁切、打包，不代表真实标签截图 API 测试。</span></header><div id="scroll">
<article data-message-author-role="user" data-message-id="u1"><p>请给出计算器、长列表，并保留中间的解释文字。</p></article>
<article data-message-author-role="assistant" data-message-id="a1"><div class="markdown"><div data-dil-message-id="a1"><p>前面的讨论正文应保留为 Markdown。</p><div class="card" data-d-component="box" data-d-has-border data-test-color="#d0efec"><h2>第一个独立卡片</h2><label>温度 <input value="20" type="number"></label><button>重置</button></div><p>两个卡片之间的解释不能被截图覆盖。</p><div class="card" data-d-component="box" data-d-has-border data-test-color="#e4e2fc"><h2>跨屏卡片 · 七段内容</h2><input type="checkbox" checked> 当前勾选状态<section class="band">1 · 开始</section><section class="band">2</section><section class="band">3</section><section class="band">4</section><section class="band">5</section><section class="band">6</section><section class="band">7 · 结束</section></div><p>卡片之后的说明也要保留。</p></div></div></article>
<article data-message-author-role="user" data-message-id="u2"><p>再给出普通文字。</p></article><article data-message-author-role="assistant" data-message-id="a2"><div class="markdown"><p>最后一条普通文字，作为滚动终点。</p></div></article></div>
<div data-thread-scroll-footer style="position:fixed;bottom:44px;left:20%;width:60%;height:56px;background:#ffafad;z-index:5000">模拟悬浮输入框：截图时必须临时隐藏，完成后恢复。</div>
<div class="recharts-tooltip-wrapper" style="position:fixed;left:45%;top:200px;background:#ffc;z-index:5000">模拟悬浮提示：不应进入截图</div>
<script>
window.chrome={runtime:{sendMessage:async message=>{
  if(message.type==='archive:capture'){
    for(const el of document.querySelectorAll('[data-thread-scroll-footer],.recharts-tooltip-wrapper'))if(getComputedStyle(el).visibility!=='hidden')throw Error('截图中混入悬浮输入框或提示');
    const canvas=document.createElement('canvas');canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;const c=canvas.getContext('2d');c.scale(devicePixelRatio,devicePixelRatio);c.fillStyle='white';c.fillRect(0,0,innerWidth,innerHeight);
    for(const node of document.querySelectorAll('[data-test-color],section.band')){const r=node.getBoundingClientRect();c.fillStyle=node.getAttribute('data-test-color')||'#cbe5dc';c.fillRect(r.x,r.y,r.width,r.height);c.strokeStyle='#298578';c.strokeRect(r.x,r.y,r.width,r.height);c.fillStyle='#132c31';c.font='18px system-ui';c.fillText(node.matches('section')?node.textContent:node.querySelector('h2').textContent,r.x+20,r.y+36);}
    return {data:canvas.toDataURL('image/png')};
  }
  if(message.type==='archive:download'){const a=document.createElement('a');a.href=message.url;a.download='harness-archive.zip';a.click();return {id:1};}
}}};
</script><script src="/jszip.min.js"></script><script src="/core.js"></script><script src="/automation.js"></script><script src="/content.js"></script></html>
